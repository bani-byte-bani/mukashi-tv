<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昔よくみてた番組</title>
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --text:#222; --sub:#777; --line:#e6e1d8;
  --accent:#c2452d; --chip:#f2eee7; --new:#2d7fc2;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#18171a; --card:#232226; --text:#eee; --sub:#9a97a0; --line:#34323a;
         --accent:#ff7a5c; --chip:#2e2c33; --new:#6fb3ff; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:1.5rem;margin:12px 0 2px;letter-spacing:.05em}
.lead{color:var(--sub);font-size:.85rem;margin:0 0 16px}
.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{margin-bottom:14px}
.row label.t{display:block;font-size:.8rem;color:var(--sub);margin-bottom:4px}
select{font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg);color:var(--text)}
.chk{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:.9rem}
button{font-size:1rem;padding:10px 18px;border-radius:999px;border:none;
  background:var(--accent);color:#fff;font-weight:bold;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);font-size:.85rem;padding:6px 14px}
#summary{margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#summary p{margin:0;font-size:.9rem;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.nav.bottom{border-bottom:none;border-top:1px solid var(--line);position:static}
.nav .cur{text-align:center;font-weight:bold;font-size:1.1rem;line-height:1.3}
.nav .cur small{display:block;color:var(--accent);font-weight:normal;font-size:.8rem}
.nav button{background:var(--chip);color:var(--text);font-size:.85rem;padding:8px 12px;min-width:92px;font-weight:normal}
.nav button:disabled{opacity:.35;cursor:default}
.body{padding:0 16px 14px}
h3{font-size:.85rem;margin:14px 0 6px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:3px}
h4{font-size:.8rem;margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
a.chip,.chip{background:var(--chip);border-radius:6px;padding:3px 8px;font-size:.85rem;color:var(--text);text-decoration:none}
a.chip:hover{outline:1px solid var(--accent)}
.chip small{color:var(--sub);margin-left:4px;font-size:.7rem}
.chip .n{color:var(--new);font-size:.7rem;font-weight:bold;margin-right:3px}
ul{margin:0;padding-left:1.2em;font-size:.9rem}
ul a{color:var(--text);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
ul a:hover{text-decoration-color:var(--accent)}
.hint{color:var(--sub);font-size:.75rem;margin:6px 0 0}
.empty{color:var(--sub);font-size:.85rem}
footer{margin-top:30px;font-size:.75rem;color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>昔よくみてた番組</h1>
  <p class="lead">生まれた年と学年を選ぶと、その頃の番組と世の中を振り返れます。</p>

  <div class="form">
    <div class="row">
      <label class="t" for="birth">生まれた年</label>
      <select id="birth"></select>
      <label class="chk"><input type="checkbox" id="early">早生まれ（1〜3月生）</label>
    </div>
    <div class="row">
      <label class="t" for="grade">振り返る学年</label>
      <select id="grade"></select>
    </div>
    <button id="go">振り返る</button>
  </div>

  <div id="summary" hidden>
    <p id="sumText"></p>
    <button class="ghost" id="share">URLをコピー</button>
  </div>
  <div id="result"></div>

  <footer>番組はキー局の全国ネット中心。放送年は目安です。流行語は「新語・流行語大賞」を参考にしています。</footer>
</main>

<script>
// ===== 設定 =====
const BIRTH_MIN = 1981, BIRTH_MAX = 1991;   // 試作は35〜45歳向け
const GRADES = [ // [表示名, 小1からの差]
  ["年少",-3],["年中",-2],["年長",-1],
  ["小1",0],["小2",1],["小3",2],["小4",3],["小5",4],["小6",5],
  ["中1",6],["中2",7],["中3",8],["高1",9],["高2",10],["高3",11]
];

const $ = id => document.getElementById(id);
let programsData = null;
const yearCache = {};
let runId = 0; // 連打時に古い描画を捨てるための連番

// ===== フォーム初期化 =====
for (let y = BIRTH_MAX; y >= BIRTH_MIN; y--) $("birth").add(new Option(y + "年", y));
GRADES.forEach((g, i) => $("grade").add(new Option(g[0], i)));
$("birth").value = 1986; $("grade").value = 3; // 初期値：小1

// URLパラメータから復元（旧形式の f= も学年として受け付ける）
const q = new URLSearchParams(location.search);
// 範囲外・不正な値は初期値のままにする
const setIfValid = (id, v) => { if (v != null && [...$(id).options].some(o => o.value === v)) $(id).value = v; };
if (q.get("b")) {
  setIfValid("birth", q.get("b"));
  $("early").checked = q.get("e") === "1";
  setIfValid("grade", q.get("g") ?? q.get("f"));
  run();
}

$("go").onclick = () => run();
$("share").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("share").textContent = "コピーしました"; }
  catch { prompt("このURLをコピーしてください", location.href); }
  setTimeout(() => $("share").textContent = "URLをコピー", 1500);
};

// 前後の学年へ移動
function step(d) {
  const g = +$("grade").value + d;
  if (g < 0 || g >= GRADES.length) return;
  $("grade").value = g;
  run();
}
$("result").addEventListener("click", e => {
  const b = e.target.closest("button[data-step]");
  if (b) step(+b.dataset.step);
});
document.addEventListener("keydown", e => {
  if ($("summary").hidden || e.target.closest("select,input")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

// ===== データ読み込み =====
async function loadPrograms() {
  if (!programsData) programsData = await (await fetch("data/programs.json")).json();
  return programsData;
}
async function loadYear(y) {
  if (y in yearCache) return yearCache[y];
  try {
    const r = await fetch(`data/years/${y}.json`);
    yearCache[y] = r.ok ? await r.json() : null;
  } catch { yearCache[y] = null; }
  return yearCache[y];
}

// ===== 学年 → 年 =====
function gradeYear(birth, early, idx) {
  const sho1 = birth + (early ? 6 : 7);  // 小1の年度
  return sho1 + GRADES[idx][1];
}

// ===== 実行 =====
async function run() {
  const id = ++runId;
  const birth = +$("birth").value, early = $("early").checked, g = +$("grade").value;
  history.replaceState(null, "", "?" + new URLSearchParams({ b: birth, e: early ? 1 : 0, g }));

  let data;
  try { data = await loadPrograms(); }
  catch (e) {
    $("result").innerHTML = '<p class="empty">データを読み込めませんでした。ファイルを直接開いている場合は、Webサーバー経由（npx wrangler dev など）で開いてください。</p>';
    console.error(e); return;
  }

  const y = gradeYear(birth, early, g);
  const yd = await loadYear(y);
  if (id !== runId) return; // 連打時は最後の操作だけ描画する

  $("sumText").textContent = `${birth}年${early ? "（早生まれ）" : ""}生まれ`;
  $("summary").hidden = false;
  $("result").innerHTML = renderYear(y, g, data, yd);
}

// ===== 描画 =====
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gUrl = w => "https://www.google.com/search?q=" + encodeURIComponent(w);
const link = (w, inner, cls = "") =>
  `<a${cls ? ` class="${cls}"` : ""} href="${esc(gUrl(w))}" target="_blank" rel="noopener">${inner}</a>`;

function onAir(p, y) {
  return p.periods.some(([s, e]) => s <= y && y <= (e ?? 9999));
}
function isNew(p, y) {
  return p.periods.some(([s]) => s === y);
}

function nav(y, g, pos) {
  const birth = +$("birth").value, early = $("early").checked;
  const side = d => {
    const i = g + d, ok = i >= 0 && i < GRADES.length;
    const label = ok ? (d < 0 ? `◀ ${GRADES[i][0]}` : `${GRADES[i][0]} ▶`) : (d < 0 ? "◀" : "▶");
    return `<button data-step="${d}"${ok ? "" : " disabled"} aria-label="${d < 0 ? "前の学年" : "次の学年"}">${label}</button>`;
  };
  return `<div class="nav ${pos}">${side(-1)}<div class="cur">${y}年<small>${GRADES[g][0]}</small></div>${side(1)}</div>`;
}

function renderYear(y, g, data, yd) {
  let h = `<div class="card">${nav(y, g, "top")}<div class="body">`;

  // 番組
  h += `<h3>📺 番組</h3>`;
  for (const [key, label] of data.genres) {
    const list = data.programs.filter(p => p.genre === key && onAir(p, y));
    if (!list.length) continue;
    list.sort((a, b) => isNew(b, y) - isNew(a, y));
    h += `<h4>${label}</h4><div class="chips">` +
      list.map(p => link(p.title, `${isNew(p, y) ? '<span class="n">新</span>' : ""}${esc(p.title)}<small>${esc(p.ch)}</small>`, "chip")).join("") +
      `</div>`;
  }

  if (!yd) {
    h += `<p class="empty">この年の流行語・出来事は準備中です。</p>`;
  } else {
    if (yd.buzzwords?.length) {
      h += `<h3>💬 流行語</h3><div class="chips">` +
        yd.buzzwords.map(b => link(b.w, `${esc(b.w)}${b.note ? `<small>${esc(b.note)}</small>` : ""}`, "chip")).join("") + `</div>`;
    }
    const lists = [["trends","✨ 社会現象・ブーム"],["events","📰 出来事"],
                   ["music","🎵 音楽"],["movies","🎬 映画"],["books","📚 書籍"]];
    for (const [k, label] of lists) {
      if (yd[k]?.length) h += `<h3>${label}</h3><ul>` + yd[k].map(x => {
        const t = typeof x === "string" ? x : x.title;
        return `<li>${link(t, esc(t))}</li>`;
      }).join("") + `</ul>`;
    }
  }
  h += `<p class="hint">タップでGoogle検索が開きます</p>`;
  return h + `</div>${nav(y, g, "bottom")}</div>`;
}
</script>
</body>
</html>
